worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    
    # Custom log format with timing info
    log_format custom_format '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" '
                             '$request_time $upstream_response_time';
                             
    access_log /var/log/nginx/access.log custom_format;
    
    sendfile on;
    keepalive_timeout 65;
    
    # Gzip settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    
    client_max_body_size 10M;

    upstream web {
        server web:8000;
    }

    server {
        listen 80;
        server_name _;
        
        # Certbot verification path
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # HTTP -> HTTPS Redirect
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        # Note: If ssl files are missing at first run, nginx will fail. 
        # For initial setup, we leave these commented out or provide dummy certs until certbot runs.
        # But per the instructions, path is /etc/nginx/ssl
        ssl_certificate /etc/nginx/ssl/live/placement.college.edu/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/placement.college.edu/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Serve static files directly
        location /static/ {
            alias /static/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Serve uploads with security header
        location /uploads/ {
            alias /uploads/;
            add_header X-Content-Type-Options nosniff;
            expires 30d;
        }

        # API Rate limiting
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Main application
        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
