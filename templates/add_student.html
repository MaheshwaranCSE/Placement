<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Student — Campus Placement Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar">
    <div class="nav-brand">🎓 Campus Placement Portal</div>
    <div class="nav-right">
        <span class="nav-user">👤 {{ user }}</span>
        <a href="{{ url_for('dashboard') }}" class="btn-nav-add">← Dashboard</a>
        <a href="{{ url_for('logout') }}" class="btn-nav-logout">Logout</a>
    </div>
</nav>

<div class="main-container">
<div class="form-page">

    <h2 class="form-title">📋 Add New Student Assessment</h2>

    <form method="POST" action="/submit" class="assessment-form">

        <!-- ── BASIC INFO ──────────────────────────────────────────────────── -->
        <div class="form-section">
            <h3>🧑‍🎓 Basic Information</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>Student ID *</label>
                    <input type="text" name="student_id" placeholder="e.g. STU0501" required/>
                </div>
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" name="name" placeholder="e.g. Rahul Kumar" required/>
                </div>
                <div class="form-group">
                    <label>Department *</label>
                    <select name="department" required>
                        {% for dept in departments %}
                        <option value="{{ dept }}">{{ dept }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>CGPA (0–10) *</label>
                    <input type="number" name="cgpa" min="0" max="10"
                           step="0.1" placeholder="e.g. 8.5" required/>
                </div>
                <div class="form-group">
                    <label>Backlog Count *</label>
                    <input type="number" name="backlog_count" min="0"
                           placeholder="e.g. 0" required/>
                </div>
                <div class="form-group">
                    <label>Attendance % *</label>
                    <input type="number" name="attendance_percentage"
                           min="0" max="100" step="0.1"
                           placeholder="e.g. 85" required/>
                </div>
            </div>
        </div>

        <!-- ── APTITUDE ────────────────────────────────────────────────────── -->
        <div class="form-section">
            <h3>🧠 Aptitude Scores (0–100)</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>Quantitative</label>
                    <input type="number" name="aptitude_quant_score"
                           min="0" max="100" placeholder="0–100" required/>
                </div>
                <div class="form-group">
                    <label>Logical</label>
                    <input type="number" name="aptitude_logical_score"
                           min="0" max="100" placeholder="0–100" required/>
                </div>
                <div class="form-group">
                    <label>Verbal</label>
                    <input type="number" name="aptitude_verbal_score"
                           min="0" max="100" placeholder="0–100" required/>
                </div>
            </div>
        </div>

        <!-- ── CODING ──────────────────────────────────────────────────────── -->
        <div class="form-section">
            <h3>💻 Coding Skills</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>Easy Problems (0–100)</label>
                    <input type="number" name="coding_easy_score"
                           min="0" max="100" placeholder="0–100" required/>
                </div>
                <div class="form-group">
                    <label>Medium Problems (0–100)</label>
                    <input type="number" name="coding_medium_score"
                           min="0" max="100" placeholder="0–100" required/>
                </div>
                <div class="form-group">
                    <label>Hard Problems (0–100)</label>
                    <input type="number" name="coding_hard_score"
                           min="0" max="100" placeholder="0–100" required/>
                </div>
                <div class="form-group">
                    <label>Contest Rating (0–2500)</label>
                    <input type="number" name="coding_contest_rating"
                           min="0" max="2500" placeholder="0–2500" required/>
                </div>
            </div>
        </div>

        <!-- ── SOFT SKILLS ─────────────────────────────────────────────────── -->
        <div class="form-section">
            <h3>🗣️ Communication & Soft Skills (0–100)</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>Communication</label>
                    <input type="number" name="communication_score"
                           min="0" max="100" placeholder="0–100" required/>
                </div>
                <div class="form-group">
                    <label>Presentation</label>
                    <input type="number" name="presentation_skill"
                           min="0" max="100" placeholder="0–100" required/>
                </div>
                <div class="form-group">
                    <label>Confidence</label>
                    <input type="number" name="confidence_score"
                           min="0" max="100" placeholder="0–100" required/>
                </div>
                <div class="form-group">
                    <label>Mock Interview</label>
                    <input type="number" name="interview_mock_score"
                           min="0" max="100" placeholder="0–100" required/>
                </div>
            </div>
        </div>

        <!-- ── TECHNICAL ───────────────────────────────────────────────────── -->
        <div class="form-section">
            <h3>🛠️ Technical Knowledge</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>Core Subject Score (0–100)</label>
                    <input type="number" name="core_subject_score"
                           min="0" max="100" placeholder="0–100" required/>
                </div>
                <div class="form-group">
                    <label>Project Score (0–100)</label>
                    <input type="number" name="project_score"
                           min="0" max="100" placeholder="0–100" required/>
                </div>
                <div class="form-group">
                    <label>Internship Experience</label>
                    <select name="internship_experience">
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Certifications (0–10)</label>
                    <input type="number" name="certification_count"
                           min="0" max="10" placeholder="0–10" required/>
                </div>
            </div>
        </div>

        <!-- ── ENGAGEMENT ──────────────────────────────────────────────────── -->
        <div class="form-section">
            <h3>📈 Behavioral & Engagement</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>Hackathons (0–5)</label>
                    <input type="number" name="hackathon_participation"
                           min="0" max="5" placeholder="0–5" required/>
                </div>
                <div class="form-group">
                    <label>LinkedIn Activity (0–100)</label>
                    <input type="number" name="linkedin_activity_score"
                           min="0" max="100" placeholder="0–100" required/>
                </div>
                <div class="form-group">
                    <label>Resume Score (0–100)</label>
                    <input type="number" name="resume_score"
                           min="0" max="100" placeholder="0–100" required/>
                </div>
                <div class="form-group">
                    <label>Skill Assessment (0–100)</label>
                    <input type="number" name="skill_assessment_score"
                           min="0" max="100" placeholder="0–100" required/>
                </div>
            </div>
        </div>

        <!-- ── SUBMIT ──────────────────────────────────────────────────────── -->
        <div class="form-actions">
            <button type="submit" class="btn-submit">
                🤖 Predict Placement Status
            </button>
            <a href="{{ url_for('dashboard') }}" class="btn-cancel">Cancel</a>
        </div>

    </form>
</div>
</div>

</body>
</html>
