{% extends "base.html" %}

{% block content %}
<h2 class="mb-4">Faculty Dashboard</h2>

<div class="row mb-4">
    <div class="col-md-6">
        <div class="card text-white bg-primary mb-3">
            <div class="card-body text-center">
                <h5 class="card-title">My Department Students</h5>
                <h2 class="display-4">{{ total_students }}</h2>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card text-white bg-success mb-3">
            <div class="card-body text-center">
                <h5 class="card-title">Placed Students</h5>
                <h2 class="display-4">{{ placed }}</h2>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <div class="card shadow-sm">
            <div class="card-body d-flex justify-content-between align-items-center">
                <h5 class="m-0">Quick Actions</h5>
                <div>
                    <a href="{{ url_for('students.create') }}" class="btn btn-outline-primary">Add Student</a>
                    <a href="{{ url_for('students.list_students') }}" class="btn btn-primary">View All Students</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
